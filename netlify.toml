# Nasazení z GitHubu: Netlify sestaví web ze složky web/ (data z data/ převede tools/export_web.py).
[build]
  base = "web"
  command = "npm run data -- --nasazeni && npm run build"
  publish = "dist"
  # Data rodokmenu jsou v data/ (mimo base „web“) – Netlify by jinak sestavení zrušil jako „beze změny“. Stavět vždy.
  ignore = "exit 1"
