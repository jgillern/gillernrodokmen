# Nasazení na Netlify: `npm run nasadit` (viz reference/web.md ve skillu).
[build]
  command = "npm run data -- --nasazeni && npm run build"
  publish = "dist"
  # Data rodokmenu jsou v data/ (mimo base „web“) – Netlify by jinak sestavení zrušil jako „beze změny“. Stavět vždy.
  ignore = "exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
